<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Ironman 24 Monate</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ironman">
<meta name="theme-color" content="#0C1116">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0C1116;
  --surface:#141B22;
  --surface-2:#1C252E;
  --surface-3:#232E38;
  --line:#2A343E;
  --text:#EDF1F4;
  --muted:#8D98A6;
  --faint:#5E6975;
  --swim:#45C4B0;
  --swim-dim:#1D3532;
  --bike:#E8A33D;
  --bike-dim:#3A2F19;
  --run:#E8633D;
  --run-dim:#3A2119;
  --gym:#8B7FD1;
  --gym-dim:#292544;
  --brick:#C9A96E;
  --brick-dim:#332B18;
  --good:#4CBF87;
  --warn:#E8A33D;
  --bad:#8D98A6;
  --radius:14px;
  --radius-sm:9px;
  font-size:16px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--ink);color:var(--text);}
body{
  font-family:'Inter',system-ui,sans-serif;
  overscroll-behavior-y:none;
  padding-bottom:env(safe-area-inset-bottom);
}
h1,h2,h3,.display{font-family:'Space Grotesk',system-ui,sans-serif;}
button{font-family:inherit;}
#app{
  max-width:560px;
  margin:0 auto;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  position:relative;
}

/* ---------- Topbar ---------- */
.topbar{
  position:sticky; top:0; z-index:20;
  background:linear-gradient(180deg, var(--ink) 70%, rgba(12,17,22,0.85));
  padding:calc(env(safe-area-inset-top) + 14px) 18px 10px;
}
.topbar .brand{
  display:flex; align-items:baseline; justify-content:space-between;
  margin-bottom:10px;
}
.brand h1{font-size:1.05rem; font-weight:600; margin:0; letter-spacing:0.2px;}
.brand-icon{width:22px; height:22px; flex-shrink:0;}
.brand .sub{font-size:0.78rem; color:var(--muted);}

/* course-profile progress strip */
.course{
  display:flex; align-items:flex-end; gap:2px; height:30px; margin-top:6px;
}
.course .seg{
  flex:1; background:var(--surface-2); border-radius:3px 3px 0 0; position:relative;
  min-width:3px; cursor:pointer;
}
.course .seg.done{background:var(--good);}
.course .seg.current{background:var(--bike);}
.course .seg.future{background:var(--surface-2);}

/* ---------- Main view ---------- */
#view{
  flex:1;
  padding:6px 18px 100px;
}
.section-title{
  font-size:0.72rem; text-transform:none; color:var(--muted);
  margin:22px 0 10px; letter-spacing:0.2px;
}
.section-title:first-child{margin-top:6px;}

/* week nav */
.weeknav{
  display:flex; align-items:center; justify-content:space-between;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:10px 8px; margin-bottom:16px;
}
.weeknav button{
  background:var(--surface-3); border:none; color:var(--text);
  width:38px; height:38px; border-radius:10px; font-size:1.1rem; cursor:pointer;
}
.weeknav button:disabled{opacity:0.3;}
.weeknav .mid{text-align:center;}
.weeknav .mid .wk{font-family:'Space Grotesk'; font-weight:600; font-size:1.05rem;}
.weeknav .mid .ph{font-size:0.76rem; color:var(--muted); margin-top:1px;}

/* session card */
.card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  margin-bottom:10px; overflow:hidden; position:relative;
}
.card .bar{position:absolute; left:0; top:0; bottom:0; width:4px;}
.card-head{
  display:flex; align-items:center; gap:12px; padding:13px 14px 13px 18px; cursor:pointer;
}
.card-head .icon{
  width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center;
  font-size:1.05rem; flex-shrink:0;
}
.card-head .main{flex:1; min-width:0;}
.card-head .name{font-weight:600; font-size:0.94rem; display:flex; align-items:center; gap:6px;}
.card-head .meta{font-size:0.78rem; color:var(--muted); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.card-head .right{text-align:right; flex-shrink:0;}
.card-head .soll{font-family:'Space Grotesk'; font-weight:600; font-size:0.92rem;}
.card-head .day{font-size:0.72rem; color:var(--muted); margin-top:2px;}
.prio-a{width:6px; height:6px; border-radius:50%; background:var(--run); display:inline-block; flex-shrink:0;}

.status-pill{
  display:inline-block; font-size:0.68rem; padding:2px 8px; border-radius:20px; font-weight:600;
  margin-top:4px;
}
.status-Geplant{background:var(--surface-3); color:var(--muted);}
.status-Erledigt{background:rgba(76,191,135,0.15); color:var(--good);}
.status-Verschoben{background:rgba(232,163,61,0.15); color:var(--bike);}
.status-Ausgefallen{background:rgba(141,152,166,0.15); color:var(--faint);}

.card-body{
  padding:0 16px 16px 18px; display:none; border-top:1px solid var(--line); margin-top:0;
}
.card-body.open{display:block; padding-top:14px;}
.konkret{font-size:0.87rem; line-height:1.5; color:#D7DEE5;}
.entlastung{
  margin-top:8px; font-size:0.78rem; color:var(--bike); background:var(--bike-dim);
  border-radius:8px; padding:7px 10px; line-height:1.4;
}
.chiprow{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px;}
.chip{
  background:var(--surface-3); border:1px solid var(--line); color:var(--text);
  font-size:0.78rem; padding:6px 12px; border-radius:20px; cursor:pointer; font-weight:500;
}
.chip.active-Geplant{background:var(--surface-3); border-color:var(--faint);}
.chip.active-Erledigt{background:var(--good); border-color:var(--good); color:#08130D;}
.chip.active-Verschoben{background:var(--bike); border-color:var(--bike); color:#231800;}
.chip.active-Ausgefallen{background:var(--surface-3); color:var(--faint); border-color:var(--line);}

.daypick{display:flex; gap:6px; margin-top:10px; flex-wrap:wrap;}
.daychip{
  background:var(--surface-3); border:1px solid var(--line); color:var(--muted);
  font-size:0.76rem; width:38px; height:32px; border-radius:8px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
.daychip.sel{background:var(--bike); color:#231800; border-color:var(--bike); font-weight:700;}

.logbox{margin-top:14px;}
.logrow{display:flex; gap:8px; margin-bottom:8px;}
.field{flex:1; display:flex; flex-direction:column; gap:4px;}
.field label{font-size:0.68rem; color:var(--muted);}
.field input, .field textarea{
  background:var(--surface-3); border:1px solid var(--line); border-radius:8px;
  color:var(--text); padding:8px 9px; font-size:0.85rem; font-family:inherit; width:100%;
}
.field textarea{resize:none; min-height:38px;}

/* phase accordion (Plan tab) */
.phase-block{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  margin-bottom:10px; overflow:hidden;
}
.phase-head{
  display:flex; align-items:center; justify-content:space-between; padding:14px 16px; cursor:pointer;
}
.phase-head .pname{font-weight:600; font-size:0.92rem;}
.phase-head .prange{font-size:0.76rem; color:var(--muted); margin-top:2px;}
.phase-head .pprog{font-size:0.78rem; color:var(--good); font-family:'Space Grotesk'; font-weight:600;}
.phase-weeks{display:none; padding:0 14px 14px; flex-wrap:wrap; gap:6px;}
.phase-weeks.open{display:flex;}
.wchip{
  width:40px; height:40px; border-radius:9px; background:var(--surface-3); border:1px solid var(--line);
  display:flex; align-items:center; justify-content:center; font-size:0.78rem; color:var(--muted); cursor:pointer;
  position:relative; font-weight:600;
}
.wchip.done{background:var(--good); color:#08130D; border-color:var(--good);}
.wchip.partial{background:var(--surface-3); color:var(--text); border-color:var(--good);}
.wchip.active{outline:2px solid var(--run); outline-offset:1px;}

/* stat tiles */
.stats-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px;}
.stat{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:14px 16px;
}
.stat .val{font-family:'Space Grotesk'; font-weight:700; font-size:1.5rem;}
.stat .lab{font-size:0.74rem; color:var(--muted); margin-top:2px;}

/* milestone list */
.mile{
  display:flex; align-items:flex-start; gap:12px; padding:13px 0; border-bottom:1px solid var(--line);
}
.mile:last-child{border-bottom:none;}
.mile .box{
  width:22px; height:22px; border-radius:6px; border:2px solid var(--line); flex-shrink:0; margin-top:1px;
  display:flex; align-items:center; justify-content:center; cursor:pointer; color:transparent; font-size:0.8rem;
}
.mile .box.done{background:var(--good); border-color:var(--good); color:#08130D;}
.mile .txt .zeit{font-weight:600; font-size:0.88rem;}
.mile .txt .ziel{font-size:0.82rem; color:var(--muted); margin-top:2px; line-height:1.4;}
.mile .txt input{
  margin-top:6px; background:var(--surface-3); border:1px solid var(--line); border-radius:6px;
  color:var(--text); padding:5px 8px; font-size:0.76rem; width:100%; font-family:inherit;
}

/* reference lists */
.ref-item{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm);
  padding:12px 14px; margin-bottom:8px;
}
.ref-item .rt{font-weight:600; font-size:0.86rem; display:flex; align-items:center; gap:8px;}
.ref-item .ri{font-size:0.82rem; color:#C6CDD5; margin-top:5px; line-height:1.45;}
.ref-item .rp{font-size:0.76rem; color:var(--bike); margin-top:5px;}
.rule-item{padding:11px 0; border-bottom:1px solid var(--line);}
.rule-item:last-child{border-bottom:none;}
.rule-item .th{font-weight:600; font-size:0.84rem; color:var(--swim);}
.rule-item .rg{font-size:0.83rem; color:#C6CDD5; margin-top:3px; line-height:1.45;}
.shift-cols{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.shift-col h4{font-size:0.78rem; margin:0 0 8px; color:var(--muted); font-weight:600;}
.shift-col ul{margin:0; padding-left:0; list-style:none;}
.shift-col li{font-size:0.8rem; padding:6px 0; border-bottom:1px solid var(--line); color:#D7DEE5;}
.swap-item{padding:11px 0; border-bottom:1px solid var(--line);}
.swap-item:last-child{border-bottom:none;}
.swap-item .q{font-weight:600; font-size:0.84rem;}
.swap-item .a{font-size:0.82rem; color:var(--muted); margin-top:3px;}

/* start tab */
.start-field{
  display:flex; justify-content:space-between; align-items:center; gap:10px;
  padding:12px 0; border-bottom:1px solid var(--line);
}
.start-field:last-child{border-bottom:none;}
.start-field .lab{font-size:0.85rem;}
.start-field .hint{font-size:0.72rem; color:var(--muted); margin-top:2px;}
.start-field input{
  background:var(--surface-3); border:1px solid var(--line); border-radius:8px;
  color:var(--text); padding:8px 10px; font-size:0.85rem; width:120px; text-align:right; font-family:inherit;
}
.anleitung li{font-size:0.85rem; color:#C6CDD5; line-height:1.55; margin-bottom:8px;}
.btn-reset{
  width:100%; padding:13px; background:var(--surface); border:1px solid var(--run); color:var(--run);
  border-radius:var(--radius); font-size:0.86rem; font-weight:600; margin-top:24px; cursor:pointer;
}

/* tabbar */
.tabbar{
  position:fixed; bottom:0; left:50%; transform:translateX(-50%);
  width:100%; max-width:560px;
  background:rgba(20,27,34,0.92); backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  display:flex; padding:8px 6px calc(8px + env(safe-area-inset-bottom));
  z-index:30;
}
.tabbtn{
  flex:1; background:none; border:none; color:var(--faint); display:flex; flex-direction:column;
  align-items:center; gap:3px; padding:6px 2px; cursor:pointer; font-size:0.66rem; font-weight:600;
}
.tabbtn .ic{font-size:1.15rem;}
.tabbtn.active{color:var(--text);}
.tabbtn.active .ic{color:var(--run);}

.empty{text-align:center; padding:40px 20px; color:var(--muted); font-size:0.86rem; line-height:1.6;}
.toast{
  position:fixed; bottom:88px; left:50%; transform:translateX(-50%);
  background:var(--surface-3); border:1px solid var(--line); color:var(--text);
  padding:9px 18px; border-radius:20px; font-size:0.8rem; z-index:50; opacity:0; pointer-events:none;
  transition:opacity 0.25s, transform 0.25s;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-4px);}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand">
      <div style="display:flex; align-items:center; gap:9px;"><svg class="brand-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="38" cy="38" r="22" fill="none" stroke="#45C4B0" stroke-width="8"/><circle cx="62" cy="38" r="22" fill="none" stroke="#E8A33D" stroke-width="8"/><circle cx="50" cy="60" r="22" fill="none" stroke="#E8633D" stroke-width="8"/></svg><h1 id="brandTitle">Ironman · 24 Monate</h1></div>
      <span class="sub" id="brandSub">–</span>
    </div>
    <div class="course" id="courseStrip"></div>
  </div>
  <main id="view"></main>
  <nav class="tabbar">
    <button class="tabbtn" data-tab="heute"><span class="ic">🏁</span>Heute</button>
    <button class="tabbtn" data-tab="plan"><span class="ic">🗺️</span>Plan</button>
    <button class="tabbtn" data-tab="fortschritt"><span class="ic">📈</span>Fortschritt</button>
    <button class="tabbtn" data-tab="bibliothek"><span class="ic">📚</span>Bibliothek</button>
    <button class="tabbtn" data-tab="start"><span class="ic">⚙️</span>Start</button>
  </nav>
</div>
<div class="toast" id="toast"></div>

 4–6×4 min zügig; lockere Pausen; Cooldown", "progression": "Nicht all-out"}, {"sport": "🏃", "einheit": "Long Run", "inhalt": "60–150 min locker", "progression": "Dauer progressiv; Entlastungswochen"}, {"sport": "🏋️", "einheit": "Gym A", "inhalt": "Hack Squat 3×5–8; Bank 3×6–8; Klimmzüge 3×6–10; RDL 2×8–10; Rudern 2×8–12; Seitheben 2×12–15; Core 2–3", "progression": "RIR 1–3"}, {"sport": "🏋️", "einheit": "Gym B", "inhalt": "Bulgarian Split Squat 2×8–10; Schrägbank 3×8–10; Rudern 3×8–12; Beinbeuger 2×10–12; Schulterdrücken 2×6–10; Arme 2×10–12", "progression": "RIR 1–3"}, {"sport": "🏠", "einheit": "KB Circuit", "inhalt": "5 Runden: 10 Swings; 8 Goblet Squats; 8 Rows/Seite; 8–15 Push-ups; 30 s Farmer Carry", "progression": "12 kg Start; später Gewicht erhöhen"}, {"sport": "🧱", "einheit": "Brick", "inhalt": "Direkt nach Rad 15–60 min sehr locker laufen", "progression": "Später wettkampfspezifisch"}], "tauschen": [{"wenn": "Lauf statt Schwimmen", "antwort": "Okay – Schwimmen auf nächsten geeigneten Tag schieben."}, {"wenn": "Rad statt Lauf", "antwort": "Okay, wenn kein harter Lauf direkt danach folgt."}, {"wenn": "Kraft statt Ausdauer", "antwort": "Okay als C-Einheit; Schlüsseltraining nicht unnötig ersetzen."}, {"wenn": "Einheit auslassen", "antwort": "Bei Müdigkeit lieber C zuerst streichen, A-Einheiten schützen."}]};
/* ---------- State ---------- */
let PROGRESS = {};       // sessionId -> {status, ist_min, ist_km, hf, watt, rpe, notiz, verschoben_auf}
let MILESTONES = {};     // index -> {done, note}
let SETTINGS = { currentWeek: 1, zieldatum:"", laktat:"172", z2:"130", ftp:"", kb:"12" };
let activeTab = "heute";
let openCardId = null;
let openPhase = null;
let storageReady = false;

const SPORT_META = {
  "🏊": {key:"swim", label:"Schwimmen"},
  "🚴": {key:"bike", label:"Rad"},
  "🏃": {key:"run",  label:"Lauf"},
  "🏋️": {key:"gym",  label:"Kraft"},
  "🏠": {key:"gym",  label:"Kraft"},
  "🧱": {key:"brick",label:"Brick"},
};
function sportMeta(icon){ return SPORT_META[icon] || {key:"brick", label:""}; }

const PHASES = (() => {
  const order = [], map = {};
  SESSIONS.forEach(s=>{
    if(!map[s.phase]){ map[s.phase] = {name:s.phase, start:s.woche, end:s.woche}; order.push(s.phase); }
    else map[s.phase].end = Math.max(map[s.phase].end, s.woche);
  });
  return order.map(n=>map[n]);
})();
const TOTAL_WEEKS = Math.max(...SESSIONS.map(s=>s.woche));

const WEEK_INDEX = (() => {
  const m = {};
  SESSIONS.forEach(s=>{ (m[s.woche] = m[s.woche]||[]).push(s); });
  return m;
})();

/* ---------- Storage ---------- */
async function loadState(){
  try{
    const p = localStorage.getItem('ironman_progress');
    if(p) PROGRESS = JSON.parse(p);
  }catch(e){}
  try{
    const m = localStorage.getItem('ironman_milestones');
    if(m) MILESTONES = JSON.parse(m);
  }catch(e){}
  try{
    const s = localStorage.getItem('ironman_settings');
    if(s) SETTINGS = Object.assign(SETTINGS, JSON.parse(s));
  }catch(e){}
  storageReady = true;
}
let saveTimers = {};
const STORAGE_KEYS = { progress:'ironman_progress', milestones:'ironman_milestones', settings:'ironman_settings' };
function persist(key, val){
  clearTimeout(saveTimers[key]);
  saveTimers[key] = setTimeout(()=>{
    try{ localStorage.setItem(STORAGE_KEYS[key], JSON.stringify(val)); }
    catch(e){ showToast('Speichern fehlgeschlagen'); }
  }, 250);
}
function saveProgress(){ persist('progress', PROGRESS); }
function saveMilestones(){ persist('milestones', MILESTONES); }
function saveSettings(){ persist('settings', SETTINGS); }

function getEntry(id){
  if(!PROGRESS[id]) PROGRESS[id] = {status:"Geplant", ist_min:"", ist_km:"", hf:"", watt:"", rpe:"", notiz:"", verschoben_auf:""};
  return PROGRESS[id];
}

/* ---------- Toast ---------- */
let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 1600);
}

/* ---------- Course strip (top) ---------- */
function renderCourseStrip(){
  const el = document.getElementById('courseStrip');
  el.innerHTML = "";
  const curWeek = SETTINGS.currentWeek;
  PHASES.forEach(ph=>{
    const seg = document.createElement('div');
    let cls = "seg future";
    if(ph.end < curWeek) cls = "seg done";
    else if(curWeek >= ph.start && curWeek <= ph.end) cls = "seg current";
    seg.className = cls;
    const span = ph.end - ph.start + 1;
    seg.style.flexGrow = span;
    seg.title = ph.name;
    seg.addEventListener('click', ()=>{ setTab('plan'); openPhase = ph.name; render(); });
    el.appendChild(seg);
  });
  document.getElementById('brandSub').textContent = `Woche ${curWeek} / ${TOTAL_WEEKS}`;
}

/* ---------- Tabs ---------- */
function setTab(t){
  activeTab = t;
  document.querySelectorAll('.tabbtn').forEach(b=>b.classList.toggle('active', b.dataset.tab===t));
  render();
  document.getElementById('view').scrollTop = 0;
  window.scrollTo(0,0);
}

/* ---------- Render dispatch ---------- */
function render(){
  renderCourseStrip();
  const view = document.getElementById('view');
  if(activeTab==="heute") view.innerHTML = renderHeute();
  else if(activeTab==="plan") view.innerHTML = renderPlan();
  else if(activeTab==="fortschritt") view.innerHTML = renderFortschritt();
  else if(activeTab==="bibliothek") view.innerHTML = renderBibliothek();
  else if(activeTab==="start") view.innerHTML = renderStart();
  attachHandlers();
}

/* ---------- HEUTE tab ---------- */
function renderHeute(){
  const wk = SETTINGS.currentWeek;
  const list = (WEEK_INDEX[wk]||[]).slice().sort((a,b)=>0);
  const phase = PHASES.find(p=>wk>=p.start && wk<=p.end);
  let html = `
  <div class="weeknav">
    <button data-act="prevweek" ${wk<=1?'disabled':''}>‹</button>
    <div class="mid"><div class="wk">Woche ${wk}</div><div class="ph">${phase?phase.name:''}</div></div>
    <button data-act="nextweek" ${wk>=TOTAL_WEEKS?'disabled':''}>›</button>
  </div>`;
  if(!list.length){ html += `<div class="empty">Keine Einheiten in dieser Woche.</div>`; return html; }
  html += list.map(s=>renderCard(s)).join('');
  return html;
}

function renderCard(s){
  const e = getEntry(s.id);
  const meta = sportMeta(s.sport);
  const open = openCardId === s.id;
  const status = e.status || "Geplant";
  return `
  <div class="card" data-id="${s.id}">
    <div class="bar" style="background:var(--${meta.key})"></div>
    <div class="card-head" data-act="toggleCard" data-id="${s.id}">
      <div class="icon" style="background:var(--${meta.key}-dim); color:var(--${meta.key})">${s.sport}</div>
      <div class="main">
        <div class="name">${s.prio==='A'?'<span class="prio-a"></span>':''}${escapeHtml(s.einheit)}</div>
        <div class="meta">${escapeHtml(s.ziel||'')}</div>
      </div>
      <div class="right">
        <div class="soll">${s.soll?s.soll+' min':''}</div>
        <div class="day">${s.tag}</div>
        <div class="status-pill status-${status}">${status}</div>
      </div>
    </div>
    <div class="card-body ${open?'open':''}">
      ${renderCardBody(s, e)}
    </div>
  </div>`;
}

function renderCardBody(s, e){
  const status = e.status || "Geplant";
  let html = `<div class="konkret">${escapeHtml(s.konkret)}</div>`;
  if(s.entlastung) html += `<div class="entlastung">⚡ Entlastung: ${escapeHtml(s.entlastung)}</div>`;
  html += `<div class="chiprow">`;
  ["Geplant","Erledigt","Verschoben","Ausgefallen"].forEach(st=>{
    html += `<button class="chip active-${status===st?st:''}" data-act="setStatus" data-id="${s.id}" data-status="${st}">${st}</button>`;
  });
  html += `</div>`;

  if(status === "Verschoben"){
    const days = ["Mo","Di","Mi","Do","Fr","Sa","So"];
    html += `<div class="daypick">`;
    days.forEach(d=>{
      html += `<div class="daychip ${e.verschoben_auf===d?'sel':''}" data-act="pickDay" data-id="${s.id}" data-day="${d}">${d}</div>`;
    });
    html += `</div>`;
  }

  if(status === "Erledigt"){
    html += `<div class="logbox">
      <div class="logrow">
        <div class="field"><label>Ist min</label><input type="number" inputmode="numeric" data-act="logField" data-id="${s.id}" data-field="ist_min" value="${e.ist_min||''}" placeholder="${s.soll||''}"></div>
        <div class="field"><label>Ist km</label><input type="number" inputmode="decimal" data-act="logField" data-id="${s.id}" data-field="ist_km" value="${e.ist_km||''}"></div>
      </div>
      <div class="logrow">
        <div class="field"><label>Ø HF</label><input type="number" inputmode="numeric" data-act="logField" data-id="${s.id}" data-field="hf" value="${e.hf||''}"></div>
        <div class="field"><label>Ø Watt</label><input type="number" inputmode="numeric" data-act="logField" data-id="${s.id}" data-field="watt" value="${e.watt||''}"></div>
        <div class="field"><label>RPE</label><input type="number" inputmode="numeric" min="1" max="10" data-act="logField" data-id="${s.id}" data-field="rpe" value="${e.rpe||''}"></div>
      </div>
      <div class="field"><label>Notiz</label><textarea data-act="logField" data-id="${s.id}" data-field="notiz" placeholder="Wie lief's?">${escapeHtml(e.notiz||'')}</textarea></div>
    </div>`;
  }
  return html;
}

/* ---------- PLAN tab ---------- */
function renderPlan(){
  let html = `<div class="section-title">104 Wochen im Überblick</div>`;
  html += PHASES.map(ph=>{
    const weeks = [];
    for(let w=ph.start; w<=ph.end; w++) weeks.push(w);
    const doneCount = weeks.filter(w => weekDoneRatio(w)===1).length;
    const isOpen = openPhase === ph.name;
    let chips = weeks.map(w=>{
      const ratio = weekDoneRatio(w);
      let cls = "wchip";
      if(ratio===1) cls += " done"; else if(ratio>0) cls += " partial";
      if(w===SETTINGS.currentWeek) cls += " active";
      return `<div class="${cls}" data-act="gotoWeek" data-week="${w}">${w}</div>`;
    }).join('');
    return `<div class="phase-block">
      <div class="phase-head" data-act="togglePhase" data-phase="${escapeAttr(ph.name)}">
        <div><div class="pname">${escapeHtml(ph.name)}</div><div class="prange">Woche ${ph.start}–${ph.end}</div></div>
        <div class="pprog">${doneCount}/${weeks.length}</div>
      </div>
      <div class="phase-weeks ${isOpen?'open':''}">${chips}</div>
    </div>`;
  }).join('');
  return html;
}
function weekDoneRatio(w){
  const list = WEEK_INDEX[w]||[];
  if(!list.length) return 0;
  const done = list.filter(s=> (PROGRESS[s.id]?.status)==="Erledigt").length;
  return done/list.length;
}

/* ---------- FORTSCHRITT tab ---------- */
function renderFortschritt(){
  const totalSessions = SESSIONS.length;
  const doneSessions = SESSIONS.filter(s=>(PROGRESS[s.id]?.status)==="Erledigt").length;
  const totalMin = SESSIONS.reduce((sum,s)=>{
    const e = PROGRESS[s.id];
    if(e && e.status==="Erledigt" && e.ist_min) return sum + Number(e.ist_min);
    return sum;
  },0);
  const totalKm = SESSIONS.reduce((sum,s)=>{
    const e = PROGRESS[s.id];
    if(e && e.status==="Erledigt" && e.ist_km) return sum + Number(e.ist_km);
    return sum;
  },0);
  const weeksLeft = TOTAL_WEEKS - SETTINGS.currentWeek;

  let html = `<div class="section-title">Gesamtfortschritt</div>
  <div class="stats-grid">
    <div class="stat"><div class="val">${doneSessions}<span style="font-size:0.9rem;color:var(--muted)">/${totalSessions}</span></div><div class="lab">Einheiten erledigt</div></div>
    <div class="stat"><div class="val">${weeksLeft}</div><div class="lab">Wochen bis Zieltag</div></div>
    <div class="stat"><div class="val">${Math.round(totalMin/60)}</div><div class="lab">Trainingsstunden geloggt</div></div>
    <div class="stat"><div class="val">${totalKm.toFixed(0)}</div><div class="lab">km geloggt</div></div>
  </div>
  <div class="section-title">Meilensteine</div>
  <div class="card" style="padding:4px 16px;">`;
  REF.meilensteine.forEach((m,i)=>{
    const st = MILESTONES[i] || {done:false, note:""};
    html += `<div class="mile">
      <div class="box ${st.done?'done':''}" data-act="toggleMilestone" data-i="${i}">${st.done?'✓':''}</div>
      <div class="txt">
        <div class="zeit">${escapeHtml(m.zeit)}</div>
        <div class="ziel">${escapeHtml(m.ziel)}</div>
        <input type="text" placeholder="Datum / Notiz" data-act="milestoneNote" data-i="${i}" value="${escapeAttr(st.note||'')}">
      </div>
    </div>`;
  });
  html += `</div>`;
  return html;
}

/* ---------- BIBLIOTHEK tab ---------- */
function renderBibliothek(){
  let html = `<div class="section-title">Übungen & Einheiten</div>`;
  REF.uebungen.forEach(u=>{
    const meta = sportMeta(u.sport);
    html += `<div class="ref-item">
      <div class="rt"><span>${u.sport}</span>${escapeHtml(u.einheit)}</div>
      <div class="ri">${escapeHtml(u.inhalt)}</div>
      <div class="rp">${escapeHtml(u.progression)}</div>
    </div>`;
  });

  html += `<div class="section-title">Regeln</div><div class="card" style="padding:2px 16px;">`;
  REF.regeln.forEach(r=>{
    html += `<div class="rule-item"><div class="th">${escapeHtml(r.thema)}</div><div class="rg">${escapeHtml(r.regel)}</div></div>`;
  });
  html += `</div>`;

  html += `<div class="section-title">Wechselschicht-Vorlagen</div><div class="card" style="padding:14px 16px;">
    <div class="shift-cols">
      <div class="shift-col"><h4>Frühschicht</h4><ul>${REF.wechselschicht.fruehschicht.map(x=>`<li>${escapeHtml(x)}</li>`).join('')}</ul></div>
      <div class="shift-col"><h4>Spätschicht</h4><ul>${REF.wechselschicht.spaetschicht.map(x=>`<li>${escapeHtml(x)}</li>`).join('')}</ul></div>

  REF.tauschen.forEach(t=>{
    html += `<div class="swap-item"><div class="q">${escapeHtml(t.wenn)}</div><div class="a">${escapeHtml(t.antwort)}</div></div>`;
  });
  html += `</div>`;
  return html;
}

/* ---------- START tab ---------- */
function renderStart(){
  let html = `<div class="section-title">Startwerte</div><div class="card" style="padding:2px 16px;">
    <div class="start-field"><div><div class="lab">Zieldatum</div><div class="hint">Sobald der Ironman feststeht</div></div><input type="date" data-act="setting" data-field="zieldatum" value="${SETTINGS.zieldatum||''}" style="width:150px;"></div>
    <div class="start-field"><div><div class="lab">Lauf-Laktatschwelle</div><div class="hint">bpm · aktueller Garmin-Wert</div></div><input type="number" data-act="setting" data-field="laktat" value="${SETTINGS.laktat||''}"></div>
    <div class="start-field"><div><div class="lab">Lauf-Z2-Obergrenze</div><div class="hint">bpm · frei änderbar</div></div><input type="number" data-act="setting" data-field="z2" value="${SETTINGS.z2||''}"></div>
    <div class="start-field"><div><div class="lab">Rad-FTP</div><div class="hint">Watt · optional</div></div><input type="number" data-act="setting" data-field="ftp" value="${SETTINGS.ftp||''}"></div>
    <div class="start-field"><div><div class="lab">Kettlebell-Gewicht</div><div class="hint">kg · aktuell als Einstieg</div></div><input type="number" data-act="setting" data-field="kb" value="${SETTINGS.kb||''}"></div>
  </div>

  return html;
}

/* ---------- Event delegation ---------- */
function attachHandlers(){
  const view = document.getElementById('view');
  view.onclick = async (ev)=>{
    const t = ev.target.closest('[data-act]');
    if(!t) return;
    const act = t.dataset.act;

    if(act==="toggleCard"){
      const id = t.dataset.id;
      openCardId = openCardId===id ? null : id;
      render();
    }
    else if(act==="setStatus"){
      const id = t.dataset.id, status = t.dataset.status;
      const e = getEntry(id);
      e.status = status;
      saveProgress();
      render();
      openCardId = id;
    }
    else if(act==="pickDay"){
      const id = t.dataset.id, day = t.dataset.day;
      const e = getEntry(id);
      e.verschoben_auf = day;
      saveProgress();
      render();
      openCardId = id;
    }
    else if(act==="prevweek"){
      SETTINGS.currentWeek = Math.max(1, SETTINGS.currentWeek-1);
      saveSettings(); render();
    }
    else if(act==="nextweek"){
      SETTINGS.currentWeek = Math.min(TOTAL_WEEKS, SETTINGS.currentWeek+1);
      saveSettings(); render();
    }
    else if(act==="togglePhase"){
      const ph = t.dataset.phase;
      openPhase = openPhase===ph ? null : ph;
      render();
    }
    else if(act==="gotoWeek"){
      SETTINGS.currentWeek = Number(t.dataset.week);
      saveSettings();
      setTab('heute');
    }
    else if(act==="toggleMilestone"){
      const i = t.dataset.i;
      if(!MILESTONES[i]) MILESTONES[i] = {done:false, note:""};
      MILESTONES[i].done = !MILESTONES[i].done;
      saveMilestones();
      render();
    }
    else if(act==="resetAll"){
      if(confirm("Wirklich den gesamten Fortschritt (Status, Logs, Meilensteine) löschen?")){
        PROGRESS = {}; MILESTONES = {};
        try{ localStorage.removeItem('ironman_progress'); }catch(e){}
        try{ localStorage.removeItem('ironman_milestones'); }catch(e){}
        showToast('Zurückgesetzt');
        render();
      }
    }
  };

  view.oninput = (ev)=>{
    const t = ev.target.closest('[data-act]');
    if(!t) return;
    const act = t.dataset.act;
    if(act==="logField"){
      const id = t.dataset.id, field = t.dataset.field;
      const e = getEntry(id);
      e[field] = t.value;
      saveProgress();
    }
    else if(act==="milestoneNote"){
      const i = t.dataset.i;
      if(!MILESTONES[i]) MILESTONES[i] = {done:false, note:""};
      MILESTONES[i].note = t.value;
      saveMilestones();
    }
    else if(act==="setting"){
      const field = t.dataset.field;
      SETTINGS[field] = t.value;
      saveSettings();
    }
  };
}

document.querySelectorAll('.tabbtn').forEach(b=>{
  b.addEventListener('click', ()=>setTab(b.dataset.tab));
});

/* ---------- Utils ---------- */
function escapeHtml(str){
  if(str===undefined||str===null) return "";
  return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(str){ return escapeHtml(str); }

/* ---------- Init ---------- */
(async function init(){
  document.querySelector(`.tabbtn[data-tab="heute"]`).classList.add('active');
  await loadState();
  render();
})();

</script>
